version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: node src/server.js
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "cd frontend && npm start -- -p 3000"
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - api
